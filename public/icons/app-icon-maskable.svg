<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="textGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="subTextGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="dropShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center Card Badge within Safe Zone (80% scale) -->
  <g transform="translate(51, 51) scale(0.8)" filter="url(#dropShadowMask)">
    <!-- Main Card Body -->
    <path d="M90 100 C 90 75, 110 55, 135 55 L 377 55 C 402 55, 422 75, 422 100 L 422 315 C 422 340, 402 360, 377 360 L 245 360 L 175 425 L 175 360 L 135 360 C 110 360, 90 340, 90 315 Z" fill="#ffffff" />
    
    <!-- Text: ENGLISH -->
    <text x="256" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGradMask)" text-anchor="middle" letter-spacing="4">ENGLISH</text>
    
    <!-- Decorative Divider line -->
    <rect x="146" y="212" width="220" height="5" rx="2.5" fill="url(#subTextGradMask)" />

    <!-- Text: LEARNING -->
    <text x="256" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#subTextGradMask)" text-anchor="middle" letter-spacing="6">LEARNING</text>

    <!-- AI Sparkle -->
    <g transform="translate(345, 335) scale(1.15)">
      <path d="M 40 0 Q 40 25, 65 25 Q 40 25, 40 50 Q 40 25, 15 25 Q 40 25, 40 0 Z" fill="#facc15" />
      <circle cx="40" cy="25" r="5" fill="#ffffff" />
    </g>
  </g>
</svg>
