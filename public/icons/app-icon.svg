<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow / border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#glowGrad)" stroke-width="6" />

  <!-- Center Card Badge with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Card Body -->
    <path d="M90 100 C 90 75, 110 55, 135 55 L 377 55 C 402 55, 422 75, 422 100 L 422 315 C 422 340, 402 360, 377 360 L 245 360 L 175 425 L 175 360 L 135 360 C 110 360, 90 340, 90 315 Z" fill="#ffffff" />
    
    <!-- Text: ENGLISH -->
    <text x="256" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">ENGLISH</text>
    
    <!-- Decorative Divider line -->
    <rect x="146" y="212" width="220" height="5" rx="2.5" fill="url(#subTextGrad)" />

    <!-- Text: LEARNING -->
    <text x="256" y="282" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#subTextGrad)" text-anchor="middle" letter-spacing="6">LEARNING</text>
  </g>

  <!-- AI Sparkle / Star elements at bottom right -->
  <g transform="translate(355, 345) scale(1.15)">
    <path d="M 40 0 Q 40 25, 65 25 Q 40 25, 40 50 Q 40 25, 15 25 Q 40 25, 40 0 Z" fill="#facc15" filter="url(#dropShadow)" />
    <circle cx="40" cy="25" r="5" fill="#ffffff" />
  </g>
  <g transform="translate(75, 380) scale(0.65)">
    <path d="M 40 0 Q 40 25, 65 25 Q 40 25, 40 50 Q 40 25, 15 25 Q 40 25, 40 0 Z" fill="#38bdf8" />
  </g>
</svg>
